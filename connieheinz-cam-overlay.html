<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>connieheinz cam overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<style>
  :root{--blue:#5a6cf2;--pink:#ff4fa3;--orange:#ffa14a;--ink:#2a0b4d;--t:1.5vw;--speed:7s}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  .wrap{position:absolute;inset:0}
  /* animeret kant: en roterende farvesweep, skåret ud til en ring */
  .frame{position:absolute;inset:0;padding:var(--t);overflow:hidden;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
  .frame::before{content:'';position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;
    background:conic-gradient(from 0deg,var(--blue),var(--pink),var(--orange),var(--pink),var(--blue));
    animation:spin var(--speed) linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glow{position:absolute;inset:0;filter:blur(1vw);animation:pulse 3.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
  /* logo */
  #logo{position:absolute;width:12vw;filter:drop-shadow(0 .3vw .8vw rgba(42,11,77,.6))}
  #logo.tl{left:2.2vw;top:2.4vw}#logo.tr{right:2.2vw;top:2.4vw}
  #logo.bl{left:2.2vw;bottom:2.4vw}#logo.br{right:2.2vw;bottom:2.4vw}
  /* navn */
  .name{position:absolute;left:0;right:0;bottom:calc(var(--t) + 1.3vw);text-align:center;
    font-family:'Bowlby One','Impact','Arial Black',sans-serif;font-size:var(--ns,7vw);line-height:1;letter-spacing:.03em;
    text-transform:uppercase;color:#fff;
    background:linear-gradient(105deg,#fff 0%,#fff 42%,#ffc2e0 50%,#fff 58%,#fff 100%);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:sheen 5s ease-in-out infinite;
    filter:drop-shadow(.14vw 0 0 var(--ink)) drop-shadow(-.14vw 0 0 var(--ink)) drop-shadow(0 .14vw 0 var(--ink)) drop-shadow(0 -.14vw 0 var(--ink)) drop-shadow(0 .35vw .6vw rgba(42,11,77,.55))}
  @keyframes sheen{0%,35%{background-position:100% 0}75%,100%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){.frame::before,.glow,.name{animation:none}}
</style>
</head>
